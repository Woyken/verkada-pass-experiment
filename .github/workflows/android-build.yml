name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "verkada-pass-app/**"
  pull_request:
    paths:
      - "verkada-pass-app/**"
  # Cut a release without touching app code, e.g. to test the in-app update banner.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Create local.properties
        working-directory: verkada-pass-app
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        working-directory: verkada-pass-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PversionCode=$GITHUB_RUN_NUMBER

      - name: Delete existing release
        if: github.event_name != 'pull_request'
        run: gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with APK
        if: github.event_name != 'pull_request'
        run: |
          # The rolling tag never changes, so the app reads the version from
          # these notes (see UpdateChecker.kt).
          notes="$(printf 'versionCode: %s\nversionName: 1.0.%s\n\nBuilt from [%s](%s/commit/%s)' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA")"
          gh release create android-latest \
            --title "Latest Android Build" \
            --notes "$notes" \
            --prerelease \
            verkada-pass-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
