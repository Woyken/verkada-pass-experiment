name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "verkada-pass-app/**"
  pull_request:
    paths:
      - "verkada-pass-app/**"
  # Cut a release without touching app code, e.g. to test the in-app update banner.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Create local.properties
        working-directory: verkada-pass-app
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        working-directory: verkada-pass-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PversionCode=$GITHUB_RUN_NUMBER

      - name: Create release with APK
        if: github.event_name != 'pull_request'
        run: |
          # One release per build so the repository keeps a release history. The
          # app picks the newest android-v* release and reads its versionCode.
          version="1.0.$GITHUB_RUN_NUMBER"
          tag="android-v$version"
          title="Verkada Pass $version"
          notes="$(printf 'versionCode: %s\nversionName: %s\n\nBuilt from [%s](%s/commit/%s)' \
            "$GITHUB_RUN_NUMBER" "$version" "${GITHUB_SHA::7}" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA")"
          apk=verkada-pass-app/app/build/outputs/apk/debug/app-debug.apk

          # A rerun reuses its run number, so an old build can be replayed after a
          # newer one. Compare against the highest published build, not the most
          # recent list entry, and state "latest" explicitly: omitting the flag
          # lets gh choose by date, which a late rerun would win.
          tags="$(gh release list --limit 100 --json tagName --jq '.[].tagName')"
          newest_build="$(printf '%s\n' "$tags" | awk -F. '/^android-v/{print $NF}' | sort -n | tail -1)"
          if [[ -z "$newest_build" || "$GITHUB_RUN_NUMBER" -ge "$newest_build" ]]; then
            latest_flag="--latest"
          else
            latest_flag="--latest=false"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            # Rerun: the asset is already this commit's APK, so keep the working
            # download and refresh only the metadata.
            if [[ "$latest_flag" == "--latest" ]]; then
              gh release edit "$tag" --title "$title" --notes "$notes" --latest
            else
              gh release edit "$tag" --title "$title" --notes "$notes"
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "$title" --notes "$notes" "$latest_flag" "$apk"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
